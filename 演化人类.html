<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>演化人类 — 13角色沙盒</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --text: #eee;
      --accent: #00cec9;
      --panel-w: 240px;
      --font-base: clamp(11px, 1.1vw, 15px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: var(--font-base);
      background: var(--bg); color: var(--text);
    }
    .screen {
      position: fixed; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center; z-index: 1;
    }
    .screen.active { display: flex; }
    #screen-menu h1 {
      font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 0.75rem; letter-spacing: 0.12em;
      color: #ffffff; font-weight: 700;
      text-shadow: 0 2px 20px rgba(0, 206, 201, 0.45), 0 0 40px rgba(255, 255, 255, 0.15);
    }
    #screen-menu .menu-subtitle { color: #b2bec3; margin: 0 0 1.5rem; font-size: 0.95rem; }
    .btn {
      cursor: pointer; border: none; padding: 0.65rem 1.5rem;
      font-size: 1rem; border-radius: 8px; color: var(--text);
      transition: transform 0.15s, background 0.15s;
    }
    .btn:hover:not(:disabled) { transform: scale(1.04); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #0984e3);
      font-size: 1.4rem; padding: 0.9rem 2.5rem;
      box-shadow: 0 4px 20px rgba(0,206,201,0.35);
    }
    .btn-secondary { background: #2d3436; }
    .btn-tool { background: rgba(45,52,54,0.92); padding: 0.35rem 0.7rem; font-size: 0.8rem; margin: 0 0.2rem; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    #screen-count { overflow-y: auto; padding: 1.5rem; justify-content: flex-start; padding-top: 3rem; }
    #screen-count h2 { margin-bottom: 1rem; }
    #count-input {
      width: 72px; padding: 0.45rem; font-size: 1.1rem; text-align: center;
      border: 2px solid #555; border-radius: 6px; background: #16213e; color: var(--text);
    }
    #count-input.shake { animation: shake 0.4s; border-color: #d63031; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}
    }
    .count-hint { color: #d63031; min-height: 1.2em; margin: 0.4rem 0; }
    .quick-btns, .preset-btns { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 720px; margin: 0.6rem 0; }
    .preset-btns .btn { font-size: 0.75rem; padding: 0.4rem 0.65rem; }
    .noise-row { margin: 1rem 0; display: flex; align-items: center; gap: 0.5rem; }
    #screen-game { padding: 0; justify-content: flex-start; }
    #btn-esc {
      position: fixed; top: 10px; right: calc(var(--panel-w) + 12px); z-index: 50;
      padding: 0.4rem 0.8rem; font-weight: bold; background: rgba(45,52,54,0.95);
      border: 1px solid #636e72; border-radius: 6px; color: var(--text); cursor: pointer; display: none;
    }
    #btn-esc.visible { display: block; }
    #btn-esc:hover { border-color: var(--accent); background: rgba(0,206,201,0.2); }
    #game-topbar {
      position: fixed; top: 0; left: 0; right: var(--panel-w); height: 44px;
      display: flex; align-items: center; justify-content: center; z-index: 10;
      background: linear-gradient(180deg, rgba(26,26,46,0.95), transparent);
    }
    #tool-bar {
      position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 0.3rem;
    }
    #arena-wrap {
      position: fixed; left: 0; right: var(--panel-w); top: 76px; bottom: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #arena { position: relative; width: min(78vw, calc(100vh - 100px)); height: min(78vh, calc(100vw - var(--panel-w) - 100px)); max-width: 880px; max-height: 680px; }
    #arena-scaler { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform-origin: center; }
    #circle-container { position: relative; width: 100%; height: 100%; transition: transform 0.3s ease; }
    #lines-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .competition-line { stroke-dasharray: 6 4; stroke-width: 2.5; opacity: 0.95; }
    @keyframes comp-line-fade { from { opacity: 0.95; } to { opacity: 0; } }
    .slot.immigrant-mutate .ball-wrap { animation: immigrant-flash 0.65s ease forwards; }
    @keyframes immigrant-flash {
      0% { filter: brightness(3) saturate(0.2); transform: scale(0.85); }
      45% { filter: brightness(2.5); }
      100% { filter: none; transform: scale(1); }
    }
    #arena.immigration-pulse { animation: arena-pulse 0.35s ease; }
    @keyframes arena-pulse {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
      50% { box-shadow: inset 0 0 80px 20px rgba(255,255,255,0.12); }
    }
    .slot {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      border: 2px solid #444; background: transparent;
      transform: translate(-50%, -50%); z-index: 5;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .slot.highlight { border-color: #fff; animation: slot-pulse 0.8s ease infinite; }
    @keyframes slot-pulse {
      0%,100%{box-shadow:0 0 8px rgba(255,255,255,0.4)}
      50%{box-shadow:0 0 14px rgba(255,255,255,0.85)}
    }
    .slot .ball-wrap { width: 100%; height: 100%; }
    .score-label {
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      font-size: 0.65rem; color: #aaa; margin-top: 3px; white-space: nowrap; display: none;
    }
    .slot.has-score .score-label { display: block; }
    .float-score {
      position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      font-weight: bold; font-size: 0.95rem; color: #00b894; pointer-events: none; z-index: 20;
      animation: float-up 0.8s ease forwards;
    }
    .float-score.neg { color: #d63031; }
    .float-score.zero { color: #95a5a6; }
    @keyframes float-up {
      0%{opacity:1;transform:translateX(-50%) translateY(0)}
      100%{opacity:0;transform:translateX(-50%) translateY(-30px)}
    }
    .slot.dying .ball-wrap, .slot.replace-die .ball-wrap { animation: die 0.55s forwards; }
    @keyframes die { to { transform: scale(0) rotate(180deg); filter: brightness(0.5); } }
    .slot.birthing .ball-wrap { animation: birth 0.55s cubic-bezier(0.68,-0.55,0.265,1.55) forwards; }
    @keyframes birth { from{transform:scale(0)} to{transform:scale(1)} }
    #btn-evolve {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 120px; height: 120px; border-radius: 50%; border: none;
      background: #00cec9; color: #1a1a2e; font-size: 1.2rem; font-weight: bold;
      cursor: pointer; z-index: 15; display: none;
      animation: pulse-evolve 2s ease infinite;
    }
    #btn-evolve.visible { display: block; }
    @keyframes pulse-evolve {
      0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(0,206,201,0.5)}
      50%{transform:translate(-50%,-50%) scale(1.05);box-shadow:0 0 24px 8px rgba(0,206,201,0.25)}
    }
    #unit-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: var(--panel-w);
      background: rgba(20,20,30,0.92); backdrop-filter: blur(8px);
      z-index: 20; transition: transform 0.4s ease; overflow: hidden;
      display: flex; flex-direction: column;
    }
    #unit-panel.collapsed { transform: translateY(calc(-100% + 32px)); }
    #panel-tab {
      position: absolute; bottom: -32px; left: 0; right: 0; height: 32px;
      background: rgba(20,20,30,0.95); text-align: center; line-height: 32px;
      cursor: pointer; font-size: 0.8rem; display: none;
    }
    #unit-panel.collapsed #panel-tab { display: block; }
    #panel-title { text-align: center; padding: 0.45rem; border-bottom: 1px solid #333; font-size: 0.9rem; flex-shrink: 0; }
    #palette-list {
      flex: 1; overflow-y: auto; padding: 0.5rem;
      display: flex; flex-direction: column; gap: 0.55rem; align-items: center;
    }
    .palette-unit { text-align: center; cursor: grab; user-select: none; }
    .palette-unit .name { font-size: 12px; color: #fff; margin-top: 2px; }
    .drag-ghost {
      position: fixed; pointer-events: none; z-index: 9999; opacity: 0.65;
      transform: translate(-50%, -50%);
    }
    #tooltip {
      position: fixed; max-width: 300px; padding: 8px 10px;
      background: rgba(30,30,40,0.95); border-radius: 6px; z-index: 10001;
      pointer-events: none; display: none; line-height: 1.45; font-size: 0.8rem;
      border: 1px solid #555;
    }
    #tooltip .tip-title { font-weight: bold; margin-bottom: 4px; }
    #tooltip .tip-persona { color: #b2bec3; margin-bottom: 4px; }
    #tooltip .tip-logic { color: #dfe6e9; font-size: 0.75rem; }
    #esc-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 100; display: none; align-items: center; justify-content: center;
    }
    #esc-overlay.open { display: flex; }
    #esc-menu {
      background: #16213e; border-radius: 12px; padding: 1.5rem;
      min-width: 280px; display: flex; flex-direction: column; gap: 0.6rem;
    }
    #esc-menu h3 { text-align: center; }
    .esc-hint { font-size: 0.72rem; color: #aaa; text-align: center; }
    #save-slots-panel { display: none; flex-direction: column; gap: 0.4rem; }
    #save-slots-panel.open { display: flex; }
    .save-slot-btn {
      padding: 0.5rem; text-align: left; background: #2d3436; border: 2px solid transparent;
      border-radius: 6px; color: var(--text); cursor: pointer; font-size: 0.8rem;
    }
    .save-slot-btn.has-data { border-color: var(--accent); }
    .save-slot-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .line-fade { animation: line-fade 0.8s forwards; }
    @keyframes line-fade { 0%,70%{opacity:1} 100%{opacity:0} }

    /* ===== Role ball base ===== */
    .role-ball {
      position: relative; border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
    }
    .role-ball.size-60 { width: 60px; height: 60px; }
    .role-ball.size-40 { width: 40px; height: 40px; }
    .role-emoji { position: relative; z-index: 2; line-height: 1; pointer-events: none; }
    .role-ball.size-60 .role-emoji { font-size: 24px; }
    .role-ball.size-40 .role-emoji { font-size: 16px; }

    .role-cooperator { background: #FF6B6B; box-shadow: 0 0 12px rgba(255,107,107,0.5); }
    .role-cheater { background: #4ECDC4; }
    .role-cheater::after {
      content: ''; position: absolute; width: 8px; border-top: 2px solid #2d3436;
      transform: rotate(25deg); right: 22%; bottom: 28%; z-index: 3;
    }
    .role-ball.size-40.role-cheater::after { right: 18%; bottom: 26%; width: 6px; }
    .role-sucker { background: #96CEB4; }
    .role-sucker .deco-q {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      font-size: 14px; opacity: 0.7; animation: float-q 2s infinite alternate; z-index: 3;
    }
    .role-ball.size-40 .deco-q { font-size: 11px; top: -11px; }
    @keyframes float-q { from{transform:translateX(-50%) translateY(0)} to{transform:translateX(-50%) translateY(-3px)} }
    .role-copycat { background: #FFEAA7; }
    .role-copycat::before, .role-copycat::after {
      content: ''; position: absolute; width: 10px; height: 6px; top: 50%;
      border: 2px solid transparent; border-top: 2px solid #fdcb6e; border-radius: 50%; z-index: 1;
    }
    .role-copycat::before { left: -2px; transform: translateY(-50%) rotate(-30deg); }
    .role-copycat::after { right: -2px; transform: translateY(-50%) rotate(30deg); border-top-color: #fdcb6e; width: 10px; height: 6px; background: none; bottom: auto; }
    .role-ball.size-40.role-copycat::before, .role-ball.size-40.role-copycat::after { width: 7px; height: 4px; }
    .role-grudger { background: #DDA0DD; box-shadow: inset 0 -4px 4px rgba(0,0,0,0.15); }
    .role-grudger .deco-vein { position: absolute; top: 6px; font-size: 12px; transform: scale(0.5); z-index: 3; }
    .role-ball.size-40 .deco-vein { top: 2px; font-size: 10px; }
    .role-detective { background: #FF7675; }
    .role-detective .hat {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
      border-bottom: 12px solid #2d3436; z-index: 4;
    }
    .role-ball.size-40 .hat { border-left-width: 6px; border-right-width: 6px; border-bottom-width: 9px; top: -8px; }
    .role-detective .pipe-stem {
      position: absolute; width: 3px; height: 8px; background: #8B4513;
      left: 18%; bottom: 22%; transform: rotate(-30deg); z-index: 3;
    }
    .role-detective .pipe-bowl {
      position: absolute; width: 4px; height: 4px; background: #8B4513; border-radius: 50%;
      left: 14%; bottom: 18%; z-index: 3;
    }
    .role-detective .mustache-l, .role-detective .mustache-r {
      position: absolute; width: 6px; height: 3px; background: #6d4c41; border-radius: 50%;
      bottom: 38%; z-index: 3;
    }
    .role-detective .mustache-l { left: 32%; transform: rotate(20deg); }
    .role-detective .mustache-r { right: 32%; transform: rotate(-20deg); }
    .role-detective .brow-l, .role-detective .brow-r {
      position: absolute; width: 4px; height: 2px; background: #2d3436; top: 32%; z-index: 3;
    }
    .role-detective .brow-l { left: 28%; transform: rotate(25deg); }
    .role-detective .brow-r { right: 28%; transform: rotate(-25deg); }
    .role-pavlov {
      background: #A29BFE;
      padding: 2px;
      background: conic-gradient(from 0deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
    }
    .role-pavlov .pavlov-inner { width: 100%; height: 100%; border-radius: 50%; background: #A29BFE; display: flex; align-items: center; justify-content: center; position: relative; }
    .role-pavlov .deco-arrows { position: absolute; top: -12px; font-size: 14px; color: #fff; z-index: 3; }
    .role-ball.size-40 .deco-arrows { font-size: 11px; top: -10px; }
    .role-generous { background: #FDCB6E; }
    .role-generous .halo {
      position: absolute; width: 70px; height: 70px; border: 2px solid #fdcb6e;
      border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 0;
    }
    .role-ball.size-40 .halo { width: 46px; height: 46px; }
    .role-generous .deco-heart { position: absolute; bottom: -2px; transform: scale(0.5); z-index: 3; }
    .role-titfortwo { background: #74B9FF; }
    .role-titfortwo .badge-2 {
      position: absolute; top: -8px; width: 16px; height: 16px; border-radius: 50%;
      background: #0984e3; color: #fff; font-size: 10px;
      display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 3;
    }
    .role-ball.size-40 .badge-2 { width: 12px; height: 12px; font-size: 8px; top: -6px; }
    .role-conformist { background: #00B894; }
    .role-conformist .eye-arrow-l {
      position: absolute; left: 22%; top: 38%; width: 0; height: 0;
      border-right: 4px solid #fff; border-top: 3px solid transparent; border-bottom: 3px solid transparent;
    }
    .role-conformist .eye-arrow-r {
      position: absolute; right: 22%; top: 38%; width: 0; height: 0;
      border-left: 4px solid #fff; border-top: 3px solid transparent; border-bottom: 3px solid transparent;
    }
    .role-fair { background: #E17055; }
    .role-fair .leaf-l, .role-fair .leaf-r {
      position: absolute; font-size: 14px; transform: scale(0.4); z-index: 3;
    }
    .role-fair .leaf-l { left: -4px; top: 50%; transform: scale(0.4) rotate(45deg); }
    .role-fair .leaf-r { right: -4px; top: 50%; transform: scale(0.4) rotate(-45deg); }
    .role-prober { background: #636E72; }
    .role-prober .mask {
      position: absolute; width: 36px; height: 8px; background: #2d3436;
      border-radius: 2px; top: 38%; left: 50%; transform: translateX(-50%); z-index: 3;
    }
    .role-ball.size-40 .mask { width: 26px; height: 6px; }
    .role-prober .dagger {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%) rotate(-45deg); z-index: 3;
    }
    .role-prober .dagger-blade {
      width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent;
      border-bottom: 10px solid #b2bec3; margin: 0 auto;
    }
    .role-prober .dagger-handle { width: 3px; height: 4px; background: #636e72; margin: 0 auto; }
    .role-joker { background: #B2BEC3; border: 2px dashed #fff; animation: joker-spin 4s linear infinite; }
    @keyframes joker-spin { to { transform: rotate(360deg); } }
    .role-joker .joker-inner { animation: joker-spin-rev 4s linear infinite; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    @keyframes joker-spin-rev { to { transform: rotate(-360deg); } }
    .role-joker .jq, .role-joker .je {
      position: absolute; font-size: 12px; opacity: 0; animation: joker-blink 2s infinite; z-index: 3;
    }
    .role-joker .je { animation-delay: 0.5s; }
    @keyframes joker-blink { 0%,45%{opacity:0} 55%,100%{opacity:0.85} }

    /* ===== Main menu (3 entries) ===== */
    .menu-entries { display: flex; flex-direction: column; gap: 1rem; width: min(360px, 90vw); }
    .menu-entry {
      padding: 1rem 1.5rem; font-size: 1.15rem; border-radius: 10px;
      border: 2px solid #636e72; background: #16213e; cursor: pointer; text-align: center;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      color: #f5f6fa; font-weight: 600;
    }
    .menu-entry:hover:not(.locked) { border-color: var(--accent); transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,0,0,0.35); }
    .menu-entry.locked { opacity: 0.5; cursor: not-allowed; color: #888; font-weight: normal; }
    .menu-entry.recommended {
      border-color: #fdcb6e;
      background: linear-gradient(135deg, rgba(253, 203, 110, 0.22), rgba(0, 206, 201, 0.18));
      color: #ffffff;
      box-shadow: 0 0 22px rgba(253, 203, 110, 0.35), inset 0 0 0 1px rgba(253, 203, 110, 0.25);
    }
    .menu-entry.recommended:hover { border-color: #ffeaa7; box-shadow: 0 0 28px rgba(253, 203, 110, 0.45); }
    .menu-entry .menu-star { color: #fdcb6e; margin-right: 0.35rem; }
    .menu-entry .menu-hint { display: block; font-size: 0.72rem; font-weight: normal; color: #dfe6e9; margin-top: 0.35rem; opacity: 0.95; }

    /* ===== Classroom map ===== */
    #screen-classroom-map { overflow-y: auto; padding: 2rem 1rem; justify-content: flex-start; }
    #screen-classroom-map h2 { margin-bottom: 0.5rem; }
    .map-back { position: fixed; top: 12px; left: 12px; z-index: 5; }
    .map-chapter { margin: 1.5rem 0; max-width: 900px; width: 100%; }
    .map-chapter h3 { font-size: 0.95rem; color: #aaa; margin-bottom: 0.75rem; border-left: 3px solid var(--accent); padding-left: 0.5rem; }
    .map-nodes { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .map-node {
      width: 72px; padding: 0.5rem 0.35rem; border-radius: 10px; text-align: center;
      cursor: pointer; border: 2px solid #555; background: #16213e; font-size: 0.75rem;
      transition: transform 0.15s, border-color 0.2s;
    }
    .map-node:hover:not(.locked) { transform: scale(1.05); }
    .map-node.locked { opacity: 0.4; cursor: not-allowed; }
    .map-node.unlocked { border-color: var(--node-color, var(--accent)); background: transparent; }
    .map-node.done { background: var(--node-color, var(--accent)); color: #1a1a2e; border-color: var(--node-color); }
    .map-node.done.wrong { background: var(--node-color); opacity: 0.85; }
    .map-node .node-icon { font-size: 1.1rem; display: block; margin-bottom: 2px; }

    /* ===== Story acts ===== */
    #screen-story { background: var(--bg); padding: 2rem; overflow-y: auto; }
    .story-act { display: none; max-width: 720px; width: 100%; flex-direction: column; align-items: center; text-align: center; }
    .story-act.active { display: flex; }
    .story-title { font-size: clamp(1.6rem, 4vw, 2.2rem); margin-bottom: 1.5rem; font-weight: bold; }
    .story-body { font-size: 18px; line-height: 1.8; color: #f0f0f0; text-align: left; margin-bottom: 2rem; }
    .story-body p { margin-bottom: 1rem; }
    .story-body h3 { color: #00cec9; font-size: 1.05rem; margin: 1.25rem 0 0.5rem; }
    .story-body ul { margin: 0.5rem 0 1rem 1.25rem; }
    .story-body li { margin-bottom: 0.45rem; }
    .story-body .rules-table { width: 100%; border-collapse: collapse; margin: 0.75rem 0 1rem; font-size: 0.95rem; }
    .story-body .rules-table th, .story-body .rules-table td { border: 1px solid #555; padding: 0.45rem 0.6rem; text-align: center; }
    .story-body .rules-table th { background: rgba(0,206,201,0.15); color: #00cec9; }
    .story-prelude-text, .story-bridge-text {
      font-size: clamp(1.35rem, 3vw, 1.75rem); line-height: 1.8; color: #fff;
      margin: 2rem 0 2.5rem; font-style: italic; text-align: center;
    }
    .story-next { margin-top: auto; }
    #screen-classroom-map h2 { color: #fff; font-weight: 700; }
    #screen-classroom-map .map-desc { color: #dfe6e9 !important; }
    .cast-row { display: flex; flex-wrap: wrap; gap: 1.25rem; justify-content: center; margin: 1.5rem 0 2rem; }
    .cast-item {

    /* ===== Classroom game mode ===== */

    /* ===== Reveal modal ===== */

</head>
<body>
  <div id="screen-menu" class="screen active">

            <circle class="timer-bg" cx="30" cy="30" r="28" stroke="#444" stroke-width="4" fill="none"/>
            <circle class="timer-progress" cx="30" cy="30" r="28" stroke="#00CEC9" stroke-width="4" fill="none"
              stroke-dasharray="175.9" stroke-dashoffset="0" transform="rotate(-90 30 30)"/>
          </svg>
          <span class="timer-text">50</span>
        </div>
      </div>
      <div class="bet-options" id="story-bet-options"></div>

  <div id="screen-count" class="screen">

<script>
/* ===== RoleVisuals ===== */
const RoleVisuals = {
  roles: {
    cooperator: { id:'cooperator', name:'合作者', nameEn:'Cooperator', color:'#FF6B6B', emoji:'🤝',
      persona:'永远的老好人', logic:'对每位邻居永远出合作（C）。',
      decos:[] },
    cheater: { id:'cheater', name:'骗子', nameEn:'Cheater', color:'#4ECDC4', emoji:'😏',
      persona:'精明的利己主义者', logic:'对每位邻居永远出背叛（D）。', decos:[] },
    sucker: { id:'sucker', name:'傻子', nameEn:'Sucker', color:'#96CEB4', emoji:'🥺',
      persona:'天真的奉献者', logic:'对每位邻居永远出合作（C）。', decos:['deco-q'] },
    copycat: { id:'copycat', name:'复读机', nameEn:'Copycat', color:'#FFEAA7', emoji:'🦜',
      persona:'以牙还牙', logic:'第1轮C；之后复制该邻居上一轮对我的动作（oppAction）。', decos:[] },
    grudger: { id:'grudger', name:'记仇者', nameEn:'Grudger', color:'#DDA0DD', emoji:'😤',
      persona:'一次背叛，终身绝交', logic:'第1轮C；历史中若邻居曾对我出D，则永远D。', decos:['deco-vein'] },
    detective: { id:'detective', name:'侦探', nameEn:'Detective', color:'#FF7675', emoji:'🧐',
      persona:'试探后定型', logic:'每邻居独立：第1-4轮 C,D,C,C；若4轮内曾被背叛→复读机，否则→骗子。', decos:['hat','pipe-stem','pipe-bowl','mustache-l','mustache-r','brow-l','brow-r'] },
    pavlov: { id:'pavlov', name:'墙头草', nameEn:'Pavlov', color:'#A29BFE', emoji:'🦎',
      persona:'赢则固守，输则改变', logic:'第1轮C；上一轮得分≥2则保持上轮动作，否则翻转。', decos:['pavlov-inner','deco-arrows'] },
    generous_copycat: { id:'generous_copycat', name:'大善人', nameEn:'Generous Copycat', color:'#FDCB6E', emoji:'😇',
      persona:'宽容的复读机', logic:'第1轮C；邻居上轮C则C；上轮D则90%D、10%原谅出C。', decos:['halo','deco-heart'] },
    tit_for_two_tats: { id:'tit_for_two_tats', name:'老好人', nameEn:'Tit-for-Two-Tats', color:'#74B9FF', emoji:'😌',
      persona:'宽容两次才反击', logic:'第1轮C；仅当邻居连续两轮对我D时我才D，否则C。', decos:['badge-2'] },
    conformist: { id:'conformist', name:'跟风狗', nameEn:'Conformist', color:'#00B894', emoji:'🐑',
      persona:'随大流', logic:'第1轮C；之后根据左/右邻居上轮对我的动作，D数≥C数则两轮都D，否则都C。', decos:['eye-arrow-l','eye-arrow-r'] },
    firm_but_fair: { id:'firm_but_fair', name:'和事佬', nameEn:'Firm-But-Fair', color:'#E17055', emoji:'🤗',
      persona:'强硬但公平', logic:'记仇值grudge：>0则D并减1；=0时邻居上轮D则D且grudge=1，否则C。', decos:['leaf-l','leaf-r'] },
    prober: { id:'prober', name:'试探者', nameEn:'Prober', color:'#636E72', emoji:'🥷',
      persona:'先下手为强', logic:'第1轮D试探；若邻居前两轮都C则永远D，若第2轮报复则变复读机。', decos:['mask','dagger'] },
    joker: { id:'joker', name:'混沌', nameEn:'Joker', color:'#B2BEC3', emoji:'🎲',
      persona:'无法预测', logic:'每轮对每个邻居独立随机50% C或D，不读历史。', decos:['joker-inner','jq','je'] }
  },

  getRoleIds() { return Object.keys(this.roles); },

  createBall(roleId, size = 60) {
    const r = this.roles[roleId];
    if (!r) return document.createElement('div');
    const sz = size === 40 ? 'size-40' : 'size-60';
    const ball = document.createElement('div');
    ball.className = `role-ball role-${roleId} ${sz}`;
    ball.dataset.role = roleId;

    if (roleId === 'pavlov') {
      const inner = document.createElement('div');
      inner.className = 'pavlov-inner';
      const em = document.createElement('span');
      em.className = 'role-emoji';
      em.textContent = r.emoji;
      inner.appendChild(em);
      ball.appendChild(inner);
      const ar = document.createElement('span');
      ar.className = 'deco-arrows';
      ar.textContent = '↔';
      ball.appendChild(ar);
      return ball;
    }
    if (roleId === 'joker') {
      const inner = document.createElement('div');
      inner.className = 'joker-inner';
      const em = document.createElement('span');
      em.className = 'role-emoji';
      em.textContent = r.emoji;
      inner.appendChild(em);
      ball.appendChild(inner);
      const jq = document.createElement('span');
      jq.className = 'jq';
      jq.textContent = '❓';
      const je = document.createElement('span');
      je.className = 'je';
      je.textContent = '❕';
      ball.appendChild(jq);
      ball.appendChild(je);
      return ball;
    }
    if (roleId === 'prober') {
      const em = document.createElement('span');
      em.className = 'role-emoji';
      em.textContent = r.emoji;
      ball.appendChild(em);
      const mask = document.createElement('div');
      mask.className = 'mask';
      ball.appendChild(mask);
      const dag = document.createElement('div');
      dag.className = 'dagger';
      dag.innerHTML = '<div class="dagger-blade"></div><div class="dagger-handle"></div>';
      ball.appendChild(dag);
      return ball;
    }
    if (roleId === 'generous_copycat') {
      const halo = document.createElement('div');
      halo.className = 'halo';
      ball.appendChild(halo);
    }
    if (roleId === 'sucker') {
      const q = document.createElement('span');
      q.className = 'deco-q';
      q.textContent = '❓';
      ball.appendChild(q);
    }
    if (roleId === 'grudger') {
      const v = document.createElement('span');
      v.className = 'deco-vein';
      v.textContent = '💢';
      ball.appendChild(v);
    }
    if (roleId === 'detective') {
      ['hat','pipe-stem','pipe-bowl','mustache-l','mustache-r','brow-l','brow-r'].forEach(cls => {
        const d = document.createElement('div');
        d.className = cls;
        ball.appendChild(d);
      });
    }
    if (roleId === 'tit_for_two_tats') {
      const b = document.createElement('div');
      b.className = 'badge-2';
      b.textContent = '2';
      ball.appendChild(b);
    }
    if (roleId === 'conformist') {
      const al = document.createElement('div');
      al.className = 'eye-arrow-l';
      const ar = document.createElement('div');
      ar.className = 'eye-arrow-r';
      ball.appendChild(al);
      ball.appendChild(ar);
    }
    if (roleId === 'firm_but_fair') {
      const ll = document.createElement('span');
      ll.className = 'leaf-l';
      ll.textContent = '🌿';
      const lr = document.createElement('span');
      lr.className = 'leaf-r';
      lr.textContent = '🌿';
      ball.appendChild(ll);
      ball.appendChild(lr);
    }
    if (roleId === 'generous_copycat') {
      const h = document.createElement('span');
      h.className = 'deco-heart';
      h.textContent = '❤️';
      ball.appendChild(h);
    }

    const emoji = document.createElement('span');
    emoji.className = 'role-emoji';
    emoji.textContent = r.emoji;
    ball.appendChild(emoji);
    return ball;
  }
};

const SAVE_PREFIX = 'trustEvolution_v2_';
const SAVE_SLOTS = 5;
const DETECTIVE_PROBE = ['C','D','C','C'];

/* ===== GameState ===== */
class GameState {
  constructor() {
    this.playerCount = 0;
    this.nodes = [];
    this.round = 0;
    this.roundScores = [];
    this.cumulativeScores = [];
    this.scoreHistory = [];
    this.noiseEnabled = false;
    this.immigrationEnabled = true;
    this.histories = new Map();
    this.grudgeMap = new Map();
    this.pendingPreset = null;
  }

  static pairKey(i, j) { return `${i}_${j}`; }

  reset(count) {
    this.playerCount = count;
    this.nodes = Array(count).fill(null);
    this.round = 0;
    this.roundScores = [];
    this.cumulativeScores = Array(count).fill(0);
    this.scoreHistory = Array.from({ length: count }, () => []);
    this.histories = new Map();
    this.grudgeMap = new Map();
  }

  static getFitness(state, index) {
    const h = state.scoreHistory[index] || [];
    const avg = h.length ? h.reduce((a, b) => a + b, 0) / h.length : 0;
    return 1 + avg;
  }

  pushRoundScores(scores) {
    if (!this.scoreHistory.length) this.scoreHistory = Array.from({ length: this.playerCount }, () => []);
    for (let i = 0; i < this.playerCount; i++) {
      if (!this.nodes[i]) continue;
      if (!this.scoreHistory[i]) this.scoreHistory[i] = [];
      this.scoreHistory[i].push(scores[i]);
      if (this.scoreHistory[i].length > 5) this.scoreHistory[i].shift();
    }
  }

  isFull() { return this.nodes.length > 0 && this.nodes.every(n => n !== null); }

  static monocultureRole(state) {
    if (!state.isFull()) return null;
    const types = new Set(state.nodes);
    return types.size === 1 ? [...types][0] : null;
  }

  left(i) { return (i - 1 + this.playerCount) % this.playerCount; }
  right(i) { return (i + 1) % this.playerCount; }

  getHistory(i, j) {
    return this.histories.get(GameState.pairKey(i, j)) || [];
  }

  getGrudge(i, j) {
    return this.grudgeMap.get(GameState.pairKey(i, j)) || 0;
  }

  serialize() {
    return {
      playerCount: this.playerCount,
      nodes: [...this.nodes],
      round: this.round,
      roundScores: this.roundScores.map(r => [...r]),
      cumulativeScores: [...this.cumulativeScores],
      scoreHistory: this.scoreHistory.map(h => [...h]),
      noiseEnabled: this.noiseEnabled,
      immigrationEnabled: this.immigrationEnabled,
      histories: [...this.histories.entries()],
      grudgeMap: [...this.grudgeMap.entries()]
    };
  }

  deserialize(data) {
    this.playerCount = data.playerCount;
    this.nodes = [...data.nodes];
    this.round = data.round || 0;
    this.roundScores = (data.roundScores || []).map(r => [...r]);
    this.cumulativeScores = data.cumulativeScores || Array(this.playerCount).fill(0);
    this.scoreHistory = (data.scoreHistory || []).map(h => [...h]);
    while (this.scoreHistory.length < this.playerCount) this.scoreHistory.push([]);
    this.noiseEnabled = !!data.noiseEnabled;
    this.immigrationEnabled = data.immigrationEnabled !== false;
    this.histories = new Map(data.histories || []);
    this.grudgeMap = new Map(data.grudgeMap || []);
  }
}

/* ===== SaveManager ===== */
class SaveManager {
  constructor(refs) { this.refs = refs; }
  slotKey(i) { return SAVE_PREFIX + i; }
  listSlots() {
    const slots = [];
    for (let i = 0; i < SAVE_SLOTS; i++) {
      const raw = localStorage.getItem(this.slotKey(i));
      slots.push(raw ? JSON.parse(raw) : null);
    }
    return slots;
  }
  save(slotIndex, state) {
    localStorage.setItem(this.slotKey(slotIndex), JSON.stringify({ timestamp: Date.now(), ...state.serialize() }));
  }
  formatTime(ts) {
    return new Date(ts).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  }
  renderSlotButtons(mode, onSelect) {
    const panel = this.refs.saveSlotsPanel;
    panel.innerHTML = '';
    panel.classList.add('open');
    const slots = this.listSlots();
    for (let i = 0; i < SAVE_SLOTS; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'save-slot-btn';
      const data = slots[i];
      if (data) {
        btn.classList.add('has-data');
        btn.textContent = `档位 ${i+1} — ${this.formatTime(data.timestamp)} — ${data.playerCount}人 第${data.round}轮`;
      } else btn.textContent = `档位 ${i+1} — 空`;
      if (mode === 'load' && !data) btn.disabled = true;
      btn.addEventListener('click', () => {
        if (mode === 'load' && !data) return;
        onSelect(i, data);
        panel.classList.remove('open');
      });
      panel.appendChild(btn);
    }
  }
}

/* ===== StrategyLogic ===== */
class StrategyLogic {
  static decide(roleType, neighborId, history, currentRound, ctx) {
    const key = GameState.pairKey(ctx.playerIndex, neighborId);
    switch (roleType) {
      case 'cooperator':
      case 'sucker':
        return 'C';
      case 'cheater':
        return 'D';
      case 'copycat':
        return history.length === 0 ? 'C' : history[history.length - 1].oppAction;
      case 'grudger':
        if (history.length === 0) return 'C';
        if (history.some(h => h.oppAction === 'D')) return 'D';
        return 'C';
      case 'detective':
        return StrategyLogic.detective(history);
      case 'pavlov':
        if (history.length === 0) return 'C';
        const last = history[history.length - 1];
        if (last.myScore >= 2) return last.myAction;
        return last.myAction === 'C' ? 'D' : 'C';
      case 'generous_copycat':
        if (history.length === 0) return 'C';
        const lo = history[history.length - 1].oppAction;
        if (lo === 'C') return 'C';
        return Math.random() < 0.1 ? 'C' : 'D';
      case 'tit_for_two_tats':
        if (history.length === 0) return 'C';
        if (history.length >= 2) {
          const a = history[history.length - 2].oppAction;
          const b = history[history.length - 1].oppAction;
          if (a === 'D' && b === 'D') return 'D';
        }
        return 'C';
      case 'firm_but_fair':
        return StrategyLogic.firmButFair(key, history, ctx);
      case 'prober':
        return StrategyLogic.prober(history);
      case 'joker':
        return Math.random() < 0.5 ? 'C' : 'D';
      default:
        return 'C';
    }
  }

  static detective(history) {
    if (history.length < 4) return DETECTIVE_PROBE[history.length];
    const first4 = history.slice(0, 4);
    if (first4.some(h => h.oppAction === 'D')) {
      return history.length ? history[history.length - 1].oppAction : 'C';
    }
    return 'D';
  }

  static prober(history) {
    if (history.length === 0) return 'D';
    if (history.length >= 2) {
      if (history[0].oppAction === 'C' && history[1].oppAction === 'C') return 'D';
      if (history[1].oppAction === 'D') {
        return history[history.length - 1].oppAction;
      }
    }
    if (history.length === 1) return 'D';
    return 'D';
  }

  static firmButFair(key, history, ctx) {
    let g = ctx.grudgeMap.get(key) || 0;
    if (g > 0) {
      ctx.grudgeMap.set(key, g - 1);
      return 'D';
    }
    if (history.length === 0) return 'C';
    const last = history[history.length - 1];
    if (last.oppAction === 'D') {
      ctx.grudgeMap.set(key, 1);
      return 'D';
    }
    return 'C';
  }

  static conformistAction(playerIndex, state) {
    if (state.round === 0) return 'C';
    const L = state.left(playerIndex);
    const R = state.right(playerIndex);
    const hL = state.getHistory(playerIndex, L);
    const hR = state.getHistory(playerIndex, R);
    const lastL = hL.length ? hL[hL.length - 1].oppAction : 'C';
    const lastR = hR.length ? hR[hR.length - 1].oppAction : 'C';
    let d = 0, c = 0;
    if (lastL === 'D') d++; else c++;
    if (lastR === 'D') d++; else c++;
    return d >= c ? 'D' : 'C';
  }

  static payoff(my, opp) {
    if (my === 'C' && opp === 'C') return 2;
    if (my === 'C' && opp === 'D') return -1;
    if (my === 'D' && opp === 'C') return 3;
    return 0;
  }

  static lineColor(my, opp) {
    if (my === 'C' && opp === 'C') return '#00b894';
    if (my === 'D' && opp === 'D') return '#d63031';
    return '#e17055';
  }

  static applyNoise(action) {
    if (Math.random() < 0.05) return action === 'C' ? 'D' : 'C';
    return action;
  }
}

/* ===== EvolutionEngine ===== */
class EvolutionEngine {
  static WIN_TABLE = [0.50, 0.55, 0.70, 0.82, 0.90, 0.96, 0.995];

  static getWinProbability(diff) {
    const d = Math.abs(diff);
    const clamped = Math.min(d, 6);
    const floor = Math.floor(clamped);
    const ceil = Math.min(floor + 1, 6);
    const fraction = clamped - floor;
    const baseP = EvolutionEngine.WIN_TABLE[floor];
    const nextP = EvolutionEngine.WIN_TABLE[ceil];
    const p = baseP + (nextP - baseP) * fraction;
    return diff > 0 ? p : (1 - p);
  }

  constructor(state, circle) {
    this.state = state;
    this.circle = circle;
    this.running = false;
  }

  async runRound(opts = {}) {
      if (this.running || !this.state.isFull()) return;
      this.running = true;
      const fast = !!opts.fast;
      const N = this.state.playerCount;
    const actions = Array.from({ length: N }, () => ({}));
    const grudgeCtx = { grudgeMap: new Map(this.state.grudgeMap), playerIndex: 0 };

    for (let i = 0; i < N; i++) {
      if (!this.state.nodes[i]) continue;
      grudgeCtx.playerIndex = i;
      const role = this.state.nodes[i];
      if (role === 'conformist') {
        const act = StrategyLogic.conformistAction(i, this.state);
        actions[i][this.state.left(i)] = act;
        actions[i][this.state.right(i)] = act;
        continue;
      }
      for (const j of [this.state.left(i), this.state.right(i)]) {
        if (!this.state.nodes[j]) continue;
        const hist = this.state.getHistory(i, j);
        let act = StrategyLogic.decide(role, j, hist, this.state.round, grudgeCtx);
        if (this.state.noiseEnabled) act = StrategyLogic.applyNoise(act);
        actions[i][j] = act;
      }
    }

    this.state.grudgeMap = grudgeCtx.grudgeMap;

    const scores = Array(N).fill(0);
    const edges = [];
    for (let i = 0; i < N; i++) {
      if (!this.state.nodes[i]) continue;
      for (const j of [this.state.left(i), this.state.right(i)]) {
        if (!this.state.nodes[j]) continue;
        const my = actions[i][j];
        const opp = actions[j][i];
        if (my === undefined || opp === undefined) continue;
        const pts = StrategyLogic.payoff(my, opp);
        scores[i] += pts;
        edges.push({ i, j, color: StrategyLogic.lineColor(my, opp) });
      }
    }

      if (!fast) {
        this.circle.drawLines(edges);
        this.circle.showFloatScores(scores);
        const audio = AudioManager.get();
        let heardPos = false;
        let heardNeg = false;
        for (let i = 0; i < N; i++) {
          if (!this.state.nodes[i]) continue;
          if (scores[i] > 0) heardPos = true;
          if (scores[i] < 0) heardNeg = true;
        }
        if (heardPos) audio.playScorePopup(1);
        if (heardNeg) audio.playScorePopup(-1);
        await this.delay(400);
        this.circle.rotateRing();
        await this.delay(320);
      } else {
        for (let i = 0; i < N; i++) {
          if (this.state.nodes[i]) this.circle.updateScoreLabel(i, (this.state.cumulativeScores[i] || 0) + scores[i], scores[i]);
        }
      }

      for (let i = 0; i < N; i++) {
        this.state.cumulativeScores[i] += scores[i];
        if (!fast) this.circle.updateScoreLabel(i, this.state.cumulativeScores[i], scores[i]);
      }
      this.state.pushRoundScores(scores);

      // 每满 7 人淘汰 1 人：7→1，14→2，21→3；不足 7 人时仍至少淘汰 1 人
      const deathCount = Math.max(1, Math.floor(N / 7));
      const immortal = new Set(opts.immortalIndices || []);
      const deathCandidates = [...Array(N).keys()].filter(i => this.state.nodes[i] && !immortal.has(i));
      const actualDeathCount = deathCandidates.length
        ? Math.min(deathCount, deathCandidates.length)
        : 0;
      const victims = actualDeathCount > 0
        ? this.pickRandomFromPool(deathCandidates, actualDeathCount)
        : new Set();

      for (const idx of victims) {
        if (!fast) {
          AudioManager.get().playDeath();
          await this.circle.animateDeath(idx);
        } else this.circle.clearSlot(idx);
        this.state.nodes[idx] = null;
        this.state.scoreHistory[idx] = [];
        this.clearIndexHistory(idx);
      }

      const emptySlots = [...Array(N).keys()].filter(i => this.state.nodes[i] === null);
      for (const i of emptySlots) {
        const result = this.competeForEmptySlot(i, victims);
        if (!result) continue;
        const { donor, diff, winProb } = result;
        const role = this.state.nodes[donor];
        this.state.nodes[i] = role;
        this.state.scoreHistory[i] = [...(this.state.scoreHistory[donor] || [])];
        if (fast) {
          this.circle.setSlotStrategy(i, role, false);
        } else {
          if (result.left != null && result.right != null) {
            this.circle.showCompetitionLine(i, donor, winProb);
            const audio = AudioManager.get();
            if (Math.abs(diff) >= 3) audio.playBirthDominant();
            else if (Math.abs(diff) < 2) audio.playBirthClose();
            else audio.playBirth();
            await this.delay(320);
          } else {
            AudioManager.get().playBirth();
          }
          await this.circle.animateBirth(i, role);
        }
      }

      await this.applyImmigration(fast, opts);

    this.appendHistories(actions, scores, N);
    this.state.roundScores.push([...scores]);
    this.state.round++;
    this.circle.drawLines([]);
    this.running = false;
    return scores;
  }

  appendHistories(actions, scores, N) {
    for (let i = 0; i < N; i++) {
      if (!this.state.nodes[i]) continue;
      for (const j of [this.state.left(i), this.state.right(i)]) {
        if (!this.state.nodes[j]) continue;
        const my = actions[i][j];
        const opp = actions[j][i];
        if (my === undefined) continue;
        const key = GameState.pairKey(i, j);
        const arr = this.state.getHistory(i, j).slice();
        arr.push({
          round: this.state.round,
          myAction: my,
          oppAction: opp,
          myScore: StrategyLogic.payoff(my, opp)
        });
        this.state.histories.set(key, arr);
      }
    }
  }

  clearIndexHistory(idx) {
    for (const key of [...this.state.histories.keys()]) {
      const [a, b] = key.split('_').map(Number);
      if (a === idx || b === idx) this.state.histories.delete(key);
    }
    for (const key of [...this.state.grudgeMap.keys()]) {
      const [a, b] = key.split('_').map(Number);
      if (a === idx || b === idx) this.state.grudgeMap.delete(key);
    }
  }

  findNearestAlive(emptyIdx, goLeft, victims) {
    const N = this.state.playerCount;
    let idx = goLeft ? this.state.left(emptyIdx) : this.state.right(emptyIdx);
    for (let step = 0; step < N - 1; step++) {
      if (!victims.has(idx) && this.state.nodes[idx]) return idx;
      idx = goLeft ? this.state.left(idx) : this.state.right(idx);
      if (idx === emptyIdx) break;
    }
    return null;
  }

  competeForEmptySlot(emptyIdx, victims) {
    const left = this.findNearestAlive(emptyIdx, true, victims);
    const right = this.findNearestAlive(emptyIdx, false, victims);
    if (!left && !right) return null;
    if (left && !right) return { donor: left, left, right: null, diff: 0, winProb: 1 };
    if (right && !left) return { donor: right, left: null, right, diff: 0, winProb: 1 };
    const diff = GameState.getFitness(this.state, left) - GameState.getFitness(this.state, right);
    const leftWins = Math.random() < EvolutionEngine.getWinProbability(diff);
    const donor = leftWins ? left : right;
    const winProb = leftWins ? EvolutionEngine.getWinProbability(diff) : (1 - EvolutionEngine.getWinProbability(diff));
    return { donor, left, right, diff, winProb };
  }

  async applyImmigration(fast, opts) {
    if (opts.enableImmigration === false) return;
    const N = this.state.playerCount;
    const filled = [...Array(N).keys()].filter(i => this.state.nodes[i]);
    if (!filled.length) return;
    const mutationCount = Math.min(3, Math.max(1, Math.ceil(filled.length * 0.02)));
    const pool = filled.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const targets = pool.slice(0, mutationCount);
    const audio = AudioManager.get();
    if (!fast && targets.length) audio.playImmigration();
    for (const idx of targets) {
      const role = Math.random() < 0.5 ? 'cooperator' : 'joker';
      this.state.nodes[idx] = role;
      this.state.scoreHistory[idx] = [];
      if (fast) {
        this.circle.setSlotStrategy(idx, role, false);
      } else {
        await this.circle.animateImmigration(idx, role);
      }
    }
    if (!fast && targets.length) {
      this.circle.pulseArenaImmigration();
      await this.delay(200);
    }
  }

  pickRandomFromPool(pool, count) {
    const arr = pool.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return new Set(arr.slice(0, count));
  }

  delay(ms) { return new Promise(r => setTimeout(r, ms)); }
}

/* ===== CircleRenderer ===== */
class CircleRenderer {
  constructor(refs, state) {
    this.refs = refs;
    this.state = state;
    this.slotEls = [];
    this.positions = [];
    this.radius = 150;
    this.centerX = 0;
    this.centerY = 0;
    this.evolutionRunning = false;
  }

  calcRadius(N) {
    let t = Math.max(0, Math.min(1, (N - 5) / 31));
    let r = 150 + t * 130;
    if (2 * r * Math.sin(Math.PI / N) < 68) r = 68 / (2 * Math.sin(Math.PI / N));
    return r;
  }

  measureArena() {
    const rect = this.refs.arena.getBoundingClientRect();
    this.centerX = rect.width / 2;
    this.centerY = rect.height / 2;
  }

    buildRing(animate = true, radiusHint = null) {
      this.clearAll();
      const N = this.state.playerCount;
      this.measureArena();
      this.radius = radiusHint != null ? radiusHint : this.calcRadius(N);
    this.positions = [];
    const container = this.refs.circleContainer;
    for (let i = 0; i < N; i++) {
      const angle = (2 * Math.PI * i) / N - Math.PI / 2;
      const x = this.centerX + this.radius * Math.cos(angle);
      const y = this.centerY + this.radius * Math.sin(angle);
      this.positions.push({ x, y });
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.index = String(i);
      slot.style.left = animate ? `${this.centerX}px` : `${x}px`;
      slot.style.top = animate ? `${this.centerY}px` : `${y}px`;
      const wrap = document.createElement('div');
      wrap.className = 'ball-wrap';
      slot.appendChild(wrap);
      const label = document.createElement('span');
      label.className = 'score-label';
      slot.appendChild(label);
      container.appendChild(slot);
      this.slotEls[i] = slot;
      if (this.state.nodes[i]) this.setSlotStrategy(i, this.state.nodes[i], false);
    }
    if (animate) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (let i = 0; i < N; i++) {
          const s = this.slotEls[i];
          s.style.left = `${this.positions[i].x}px`;
          s.style.top = `${this.positions[i].y}px`;
        }
      }));
    }
    this.updateEvolveButton();
    this.fitScale();
  }

  fitScale() {
    const need = (this.radius + 50) * 2;
    const rect = this.refs.arena.getBoundingClientRect();
    const s = Math.min(1, rect.width / need, rect.height / need);
    this.refs.arenaScaler.style.transform = `scale(${s})`;
  }

  clearAll() {
    this.slotEls.forEach(el => el && el.remove());
    this.slotEls = [];
    this.positions = [];
    this.refs.linesSvg.innerHTML = '';
  }

  setSlotStrategy(index, roleId, animate = true) {
    const slot = this.slotEls[index];
    if (!slot) return;
    const wrap = slot.querySelector('.ball-wrap');
    wrap.innerHTML = '';
    wrap.appendChild(RoleVisuals.createBall(roleId, 60));
    slot.classList.add('filled');
    slot.dataset.strategy = roleId;
    if (!animate) wrap.style.transform = 'scale(1)';
  }

  clearSlot(index) {
    const slot = this.slotEls[index];
    if (!slot) return;
    slot.classList.remove('filled', 'has-score', 'dying', 'birthing', 'replace-die');
    slot.querySelector('.ball-wrap').innerHTML = '';
    delete slot.dataset.strategy;
    this.updateEvolveButton();
  }

  updateScoreLabel(index, total, roundScore) {
    const slot = this.slotEls[index];
    if (!slot) return;
    const label = slot.querySelector('.score-label');
    label.textContent = `本轮 ${roundScore >= 0 ? '+' : ''}${roundScore} · 累计 ${total}`;
    slot.classList.add('has-score');
  }

  highlightSlot(index, on) {
    const slot = this.slotEls[index];
    if (slot) slot.classList.toggle('highlight', on);
  }

  hitTestSlot(cx, cy) {
    const rect = this.refs.circleContainer.getBoundingClientRect();
    const scale = this.getScale();
    for (let i = 0; i < this.slotEls.length; i++) {
      const p = this.positions[i];
      const dx = cx - (rect.left + p.x * scale);
      const dy = cy - (rect.top + p.y * scale);
      if (Math.sqrt(dx * dx + dy * dy) <= 30 * scale) return i;
    }
    return -1;
  }

  getScale() {
    const m = this.refs.arenaScaler.style.transform.match(/scale\(([\d.]+)\)/);
    return m ? parseFloat(m[1]) : 1;
  }

  updateEvolveButton() {
    if (this.refs.screenGame && this.refs.screenGame.classList.contains('classroom-mode')) return;
    this.refs.btnEvolve.classList.toggle('visible', this.state.isFull() && !this.evolutionRunning);
  }

  drawLines(edges) {
    const svg = this.refs.linesSvg;
    svg.innerHTML = '';
    const drawn = new Set();
    for (const e of edges) {
      const key = e.i < e.j ? `${e.i}-${e.j}` : `${e.j}-${e.i}`;
      if (drawn.has(key)) continue;
      drawn.add(key);
      const p1 = this.positions[e.i], p2 = this.positions[e.j];
      if (!p1 || !p2) continue;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
      line.setAttribute('stroke', e.color);
      line.setAttribute('stroke-width', '1');
      line.classList.add('line-fade');
      svg.appendChild(line);
    }
    if (edges.length) setTimeout(() => { svg.innerHTML = ''; }, 850);
  }

  showFloatScores(scores) {
    for (let i = 0; i < scores.length; i++) {
      if (!this.slotEls[i] || !this.state.nodes[i]) continue;
      const el = document.createElement('span');
      el.className = 'float-score';
      const s = scores[i];
      el.textContent = (s > 0 ? '+' : '') + s;
      if (s < 0) el.classList.add('neg');
      if (s === 0) el.classList.add('zero');
      this.slotEls[i].appendChild(el);
      setTimeout(() => el.remove(), 820);
    }
  }

  rotateRing() {
    const c = this.refs.circleContainer;
    c.style.transform = 'rotate(5deg)';
    setTimeout(() => { c.style.transform = 'rotate(0deg)'; }, 300);
  }

  animateDeath(index) {
    return new Promise(resolve => {
      const slot = this.slotEls[index];
      if (!slot) { resolve(); return; }
      slot.classList.add('dying');
      setTimeout(() => { slot.classList.remove('dying', 'filled', 'has-score'); slot.querySelector('.ball-wrap').innerHTML = ''; delete slot.dataset.strategy; resolve(); }, 550);
    });
  }

  animateReplaceDeath(index) {
    return new Promise(resolve => {
      const slot = this.slotEls[index];
      if (!slot) { resolve(); return; }
      slot.classList.add('replace-die');
      setTimeout(() => { slot.classList.remove('replace-die'); resolve(); }, 500);
    });
  }

  animateBirth(index, roleId) {
    return new Promise(resolve => {
      this.setSlotStrategy(index, roleId, false);
      const slot = this.slotEls[index];
      slot.classList.add('birthing');
      setTimeout(() => { slot.classList.remove('birthing'); resolve(); }, 550);
    });
  }

  showCompetitionLine(emptyIdx, winnerIdx, winProb) {
    const svg = this.refs.linesSvg;
    const pe = this.positions[emptyIdx];
    const pw = this.positions[winnerIdx];
    if (!pe || !pw) return;
    let color = '#e17055';
    if (winProb >= 0.9) color = '#fdcb6e';
    else if (winProb >= 0.7) color = '#dfe6e9';
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', pe.x);
    line.setAttribute('y1', pe.y);
    line.setAttribute('x2', pw.x);
    line.setAttribute('y2', pw.y);
    line.setAttribute('stroke', color);
    line.setAttribute('class', 'competition-line');
    line.style.animation = 'comp-line-fade 0.6s ease forwards';
    svg.appendChild(line);
    setTimeout(() => { if (line.parentNode) line.remove(); }, 620);
  }

  animateImmigration(index, roleId) {
    return new Promise(resolve => {
      const slot = this.slotEls[index];
      if (!slot) { resolve(); return; }
      slot.classList.add('immigrant-mutate');
      this.setSlotStrategy(index, roleId, false);
      setTimeout(() => {
        slot.classList.remove('immigrant-mutate');
        resolve();
      }, 650);
    });
  }

  pulseArenaImmigration() {
    const arena = this.refs.arena;
    if (!arena) return;
    arena.classList.add('immigration-pulse');
    setTimeout(() => arena.classList.remove('immigration-pulse'), 380);
  }
}

/* ===== DragDropManager ===== */
class DragDropManager {
  constructor(refs, state, circle, onPlaced) {
    this.refs = refs;
    this.state = state;
    this.circle = circle;
    this.onPlaced = onPlaced;
    this.dragging = false;
    this.strategyId = null;
    this.ghost = null;
    this.highlightIdx = -1;
  }
  bind() {
    this.refs.paletteList.addEventListener('mousedown', e => {
      if (this.refs.screenGame.classList.contains('classroom-mode')) return;
      const unit = e.target.closest('.palette-unit');
      if (!unit) return;
      e.preventDefault();
      this.startDrag(unit.dataset.strategy, e.clientX, e.clientY, unit);
    });
    document.addEventListener('mousemove', e => this.onMove(e));
    document.addEventListener('mouseup', e => this.onUp(e));
  }
  startDrag(strategyId, x, y, unitEl) {
    this.dragging = true;
    this.strategyId = strategyId;
    this.ghost = document.createElement('div');
    this.ghost.className = 'drag-ghost';
    this.ghost.appendChild(RoleVisuals.createBall(strategyId, 40));
    this.ghost.style.left = `${x}px`;
    this.ghost.style.top = `${y}px`;
    document.body.appendChild(this.ghost);
    const ball = unitEl && unitEl.querySelector('.role-ball');
    if (ball) { ball.style.opacity = '0.5'; setTimeout(() => { ball.style.opacity = '1'; }, 180); }
  }
  onMove(e) {
    if (!this.dragging || !this.ghost) return;
    this.ghost.style.left = `${e.clientX}px`;
    this.ghost.style.top = `${e.clientY}px`;
    const idx = this.circle.hitTestSlot(e.clientX, e.clientY);
    if (idx !== this.highlightIdx) {
      if (this.highlightIdx >= 0) this.circle.highlightSlot(this.highlightIdx, false);
      this.highlightIdx = idx;
      if (idx >= 0) this.circle.highlightSlot(idx, true);
    }
  }
  async onUp(e) {
    if (!this.dragging) return;
    const idx = this.circle.hitTestSlot(e.clientX, e.clientY);
    if (idx >= 0 && this.strategyId) {
      if (this.state.nodes[idx]) await this.circle.animateReplaceDeath(idx);
      this.state.nodes[idx] = this.strategyId;
      if (this.state.scoreHistory) this.state.scoreHistory[idx] = [];
      this.circle.setSlotStrategy(idx, this.strategyId);
      if (this.onPlaced) this.onPlaced();
    }
    if (this.highlightIdx >= 0) this.circle.highlightSlot(this.highlightIdx, false);
    this.highlightIdx = -1;
    if (this.ghost) { this.ghost.remove(); this.ghost = null; }
    this.dragging = false;
    this.strategyId = null;
    this.circle.updateEvolveButton();
  }
}

/* ===== UIManager ===== */
class UIManager {
  constructor(refs) { this.refs = refs; this.allScreens = []; }

  registerScreens(list) { this.allScreens = list; }

  showScreen(id) {
    this.allScreens.forEach(el => el && el.classList.toggle('active', el.id === id));
    if (this.refs.btnEsc) {
      this.refs.btnEsc.classList.toggle('visible', id === 'screen-game' && !this.refs.screenGame.classList.contains('classroom-mode'));
    }
    if (id !== 'screen-game') this.closeEsc();
  }

  toggleEsc() {
    if (this.refs.escOverlay.classList.contains('open')) this.closeEsc();
    else this.openEsc();
  }

  openEsc() {
    this.refs.escOverlay.classList.add('open');
    this.refs.saveSlotsPanel.classList.remove('open');
  }

  closeEsc() {
    this.refs.escOverlay.classList.remove('open');
    this.refs.saveSlotsPanel.classList.remove('open');
  }

  setRoundText(round) {
    this.refs.roundDisplay.textContent = round === 0 ? '准备阶段' : `第 ${round} 轮`;
  }

  validateCount(val) {
    const n = parseInt(val, 10);
    if (isNaN(n) || n < 1 || n > 36) {
      this.refs.countInput.classList.add('shake');
      this.refs.countHint.textContent = '人数需在 1-36 之间';
      setTimeout(() => this.refs.countInput.classList.remove('shake'), 400);
      return null;
    }
    this.refs.countHint.textContent = '';
    return n;
  }

  renderPresetButtons(onPreset) {
    const presets = [
      { id:'classic', label:'经典对决' },
      { id:'trust', label:'信任的诞生' },
      { id:'invasion', label:'骗子的入侵' },
      { id:'noise_hell', label:'噪声地狱' },
      { id:'plague', label:'空间瘟疫' },
      { id:'prober_feast', label:'试探者盛宴' },
      { id:'pavlov_swamp', label:'变色龙沼泽' },
      { id:'chaos_edge', label:'混沌边缘' }
    ];
    const box = this.refs.presetBtns;
    box.innerHTML = '';
    presets.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-secondary';
      btn.textContent = p.label;
      btn.addEventListener('click', () => onPreset(p.id));
      box.appendChild(btn);
    });
  }

  buildPresetLayout(presetId, N) {
    const shuffle = arr => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };
    const fillWeights = (weights, n) => {
      const arr = [];
      let assigned = 0;
      weights.forEach((w, wi) => {
        const c = wi === weights.length - 1 ? n - assigned : Math.round(n * w.pct / 100);
        for (let k = 0; k < c; k++) arr.push(w.id);
        assigned += c;
      });
      while (arr.length < n) arr.push(weights[0].id);
      while (arr.length > n) arr.pop();
      return shuffle(arr);
    };

    switch (presetId) {
      case 'classic':
        return fillWeights([{id:'copycat',pct:33},{id:'cheater',pct:33},{id:'detective',pct:34}], N);
      case 'trust':
        return fillWeights([{id:'copycat',pct:33},{id:'generous_copycat',pct:33},{id:'cooperator',pct:34}], N);
      case 'invasion':
        return fillWeights([{id:'cheater',pct:28},{id:'copycat',pct:55},{id:'sucker',pct:17}], N);
      case 'noise_hell':
        return Array(N).fill('copycat');
      case 'plague': {
        const a = ['cheater'];
        while (a.length < N) a.push('conformist');
        return shuffle(a);
      }
      case 'prober_feast': {
        const probers = Math.min(6, N);
        const rest = N - probers;
        const a = Array(probers).fill('prober');
        for (let i = 0; i < rest; i++) a.push(i % 2 === 0 ? 'cooperator' : 'sucker');
        return shuffle(a);
      }
      case 'pavlov_swamp':
        return Array(N).fill('pavlov');
      case 'chaos_edge': {
        if (N <= 6) return fillWeights([{id:'joker',pct:100}], N);
        const j = Math.max(1, Math.round(N * 6 / 36));
        const c = Math.max(1, Math.round(N * 20 / 36));
        const g = Math.max(1, Math.round(N * 10 / 36));
        let rem = N - j - c - g;
        const a = [...Array(j).fill('joker'), ...Array(c).fill('copycat'), ...Array(g).fill('grudger')];
        while (rem-- > 0) a.push('copycat');
        return shuffle(a);
      }
      default:
        return Array(N).fill('copycat');
    }
  }
}

/* ===== LessonConfig ===== */
class LessonConfig {
  static resolvePositions(spec, N, taken) {
    if (Array.isArray(spec)) return spec;
    if (spec === 'all') return [...Array(N).keys()];
    if (spec === 'even') return [...Array(N).keys()].filter(i => i % 2 === 0);
    if (spec === 'odd') return [...Array(N).keys()].filter(i => i % 2 === 1);
    if (spec === 'remaining') return [...Array(N).keys()].filter(i => !taken.has(i));
    if (spec === 'everyThird') return [...Array(N).keys()].filter(i => i % 3 === 0);
    if (spec === 'everyThirdOffset1') return [...Array(N).keys()].filter(i => i % 3 === 1);
    if (spec === 'everyThirdOffset2') return [...Array(N).keys()].filter(i => i % 3 === 2);
    return [];
  }

  static buildNodes(lesson) {
    const N = lesson.playerCount;
    const nodes = Array(N).fill(null);
    const taken = new Set();
    for (const block of lesson.preplaced) {
      let posList = LessonConfig.resolvePositions(block.positions, N, taken);
      if (Array.isArray(block.positions)) posList = block.positions;
      const use = posList.slice(0, block.count);
      use.forEach(p => { if (p >= 0 && p < N) { nodes[p] = block.role; taken.add(p); } });
    }
    return nodes;
  }

class ClassroomProgress {
  static load() {
    try {
      const d = JSON.parse(localStorage.getItem(CLASSROOM_PROGRESS_KEY));
      const data = d || { unlocked: 1, lessons: {} };
      if (data.unlocked > 14) data.unlocked = 14;
      return data;
    } catch { return { unlocked: 1, lessons: {} }; }
  }
  static save(data) { localStorage.setItem(CLASSROOM_PROGRESS_KEY, JSON.stringify(data)); }
  static isUnlocked(id) { return id <= ClassroomProgress.load().unlocked; }
  static markComplete(id, wrong) {
    const d = ClassroomProgress.load();
    d.lessons[id] = { done: true, wrong: !!wrong };
    if (id >= d.unlocked && id < 14) d.unlocked = id + 1;
    ClassroomProgress.save(d);
  }
  static getLessonState(id) { return ClassroomProgress.load().lessons[id] || null; }
}

class AudioManager {
  static TIMER_CIRC = 2 * Math.PI * 28;

  static get() {
    if (!window.trustAudio) window.trustAudio = new AudioManager();
    return window.trustAudio;
  }

  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.bgmOscillators = [];
    this.isMuted = localStorage.getItem('audioMuted') === 'true';
    this._baseMaster = 0.3;
  }

  ensureContext() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.masterGain = this.ctx.createGain();
    this.masterGain.connect(this.ctx.destination);
    this.applyMasterGain();
  }

  applyMasterGain() {
    if (!this.masterGain) return;
    this.masterGain.gain.value = this.isMuted ? 0 : this._baseMaster;
  }

  playTone(freq, type, duration, delay = 0, vol = 0.3, fadeOut = true) {
    if (this.isMuted || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol, t0);
    if (fadeOut) gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  playEvolveClick() { this.playTone(440, 'sine', 0.15); }
  playDeath() { this.playTone(150, 'sawtooth', 0.4, 0, 0.35); }
  playBirth() {
    this.playTone(660, 'sine', 0.3, 0, 0.25);
    this.playTone(880, 'sine', 0.3, 0.1, 0.2);
  }
  playBirthDominant() {
    this.playTone(880, 'sine', 0.15, 0, 0.28);
    this.playTone(1100, 'sine', 0.1, 0.05, 0.22);
  }
  playBirthClose() {
    this.playTone(440, 'triangle', 0.2, 0, 0.22);
  }
  playImmigration() {
    this.playTone(660, 'sawtooth', 0.3, 0, 0.28);
  }
  playScorePopup(score) {
    if (score > 0) this.playTone(523, 'triangle', 0.1, 0, 0.2);
    else if (score < 0) this.playTone(300, 'square', 0.15, 0, 0.22);
  }
  playPredictCorrect() {
    this.playTone(523, 'sine', 0.1, 0, 0.25);
    this.playTone(659, 'sine', 0.1, 0.1, 0.25);
    this.playTone(784, 'sine', 0.2, 0.2, 0.28);
  }
  playPredictWrong() {
    this.playTone(400, 'sawtooth', 0.2, 0, 0.25);
    this.playTone(350, 'sawtooth', 0.3, 0.15, 0.22);
  }
  playTimerTick() { this.playTone(800, 'square', 0.05, 0, 0.18); }
  playReveal() {
    this.playTone(220, 'sine', 0.5, 0, 0.35);
    if (!this.isMuted && this.masterGain) {
      const g = this.masterGain.gain;
      const t = this.ctx.currentTime;
      g.cancelScheduledValues(t);
      g.setValueAtTime(this.isMuted ? 0 : this._baseMaster, t);
      g.linearRampToValueAtTime(this.isMuted ? 0 : 0.42, t + 0.35);
      g.linearRampToValueAtTime(this.isMuted ? 0 : this._baseMaster, t + 1.2);
    }
  }

  startBGM() {
    if (this.isMuted || !this.ctx || this.bgmOscillators.length) return;
    [110, 164.81].forEach(f => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.value = 0.05;
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start();
      this.bgmOscillators.push({ osc, gain });
    });
  }

  stopBGM() {
    this.bgmOscillators.forEach(({ osc }) => { try { osc.stop(); } catch (_) {} });
    this.bgmOscillators = [];
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    localStorage.setItem('audioMuted', this.isMuted ? 'true' : 'false');
    this.applyMasterGain();
    if (this.isMuted) this.stopBGM();
    return this.isMuted;
  }

  updateToggleButtons() {
    const icon = this.isMuted ? '🔇' : '🔊';
    document.querySelectorAll('.btn-audio-toggle').forEach(btn => { btn.textContent = icon; });
  }
}

/* ===== GameRules ===== */
class GameRules {
  static getHtml() {
    return `
      <p>在圆环上，每个角色与<strong>左、右两名邻居</strong>各进行一局囚徒困境。点击「演变」后，所有人<strong>同时</strong>出招，再统一结算。</p>
      <h3>得分矩阵（每局博弈）</h3>
      <table class="rules-table">
        <tr><th>你的选择</th><th>邻居选择</th><th>你的得分</th></tr>
        <tr><td>合作 C</td><td>合作 C</td><td><strong>+2</strong></td></tr>
        <tr><td>合作 C</td><td>背叛 D</td><td><strong>-1</strong></td></tr>
        <tr><td>背叛 D</td><td>合作 C</td><td><strong>+3</strong></td></tr>
        <tr><td>背叛 D</td><td>背叛 D</td><td><strong>0</strong></td></tr>
      </table>
      <p>每人每轮与两名邻居各玩一局，<strong>本轮得分 = 两局得分之和</strong>（可正可负）。</p>
      <h3>每一轮「演变」会发生什么</h3>
      <ul>
        <li><strong>博弈</strong>：按各角色策略与历史，决定对每名邻居出「合作」或「背叛」；部分关卡开启 5%「误触」，可能随机反转你的选择。</li>
        <li><strong>计分</strong>：结算得分，圆环上出现连线颜色（双合作绿、双背叛红、一方吃亏橙）与飘字得分。</li>
        <li><strong>死亡</strong>：每满 <strong>7</strong> 人随机淘汰 <strong>1</strong> 人（14 人淘汰 2 人，21 人淘汰 3 人，以此类推）；人数不足 7 时仍至少淘汰 1 人，变为空位。</li>
        <li><strong>适应度</strong>：记录最近 <strong>5 轮</strong>得分，适应度 = <strong>1 + 近期平均分</strong>（开局前几轮按已有轮数平均）。累计分用于展示，也体现长期表现。</li>
        <li><strong>出生</strong>：空位由左右方向<strong>最近存活者</strong>竞争；按双方适应度之差查表决定胜率（差 1 分约 55%，差 2 分约 70%，差 3 分以上约 82%～99.5%）。胜者策略复制到空位，并继承其近期得分记忆。</li>
        <li><strong>外部移民</strong>（感染演变可关闭）：每轮结束后，约 2% 的存活者可能被强制替换为「合作者」或「混沌」。经典课堂不触发。</li>
      </ul>
      <p>多轮之后，某种策略会在圆环上越来越多——这就是<strong>演化</strong>。经典课堂中的故事模拟，均遵循以上规则。</p>
    `;
  }
  static mount(intoEl) {
    if (intoEl) intoEl.innerHTML = GameRules.getHtml();
  }
  static openModal() {
    GameRules.mount(document.getElementById('rules-modal-body'));
    document.getElementById('rules-overlay').classList.add('open');
  }
  static closeModal() {
    document.getElementById('rules-overlay').classList.remove('open');
  }
}
