class StorySequence {
  static TIMER_TOTAL = 50;
  static TIMER_CIRC = 175.9;

  constructor(refs, app) {
    this.refs = refs;
    this.app = app;
    this.lesson = null;
    this.selectedBet = -1;
    this.timerInterval = null;
    this.timeLeft = StorySequence.TIMER_TOTAL;
    this._lastTickSecond = -1;
  }

  start(lesson) {
    AudioManager.get().stopBGM();
    this.lesson = lesson;
    this.selectedBet = -1;
    this.clearTimer();
    document.getElementById('btn-story-start').style.display = 'none';
    this.app.ui.showScreen('screen-story');
    document.documentElement.style.setProperty('--bet-color', lesson.themeColor);
    if (lesson.id === 1) {
      GameRules.mount(document.getElementById('story-rules-body'));
      this.showAct('story-rules');
    } else if (lesson.id === 2) {
      this.showAct('story-lesson2-bridge');
    } else {
      this.goStoryBg();
    }
  }
  goStoryBg() {
    const lesson = this.lesson;
    this.showAct('story-bg');
    document.getElementById('story-bg-title').textContent = lesson.name;
    document.getElementById('story-bg-title').style.color = lesson.themeColor;
    document.getElementById('story-bg-body').innerHTML = lesson.storyBg.map(p => `<p>${p}</p>`).join('');
  }
  showAct(id) {
    document.querySelectorAll('.story-act').forEach(el => el.classList.toggle('active', el.id === id));
  }
  showCast() {
    this.showAct('story-cast');
    const row = document.getElementById('story-cast-row');
    row.innerHTML = '';
    this.lesson.cast.forEach(c => {
      const r = RoleVisuals.roles[c.role];
      const item = document.createElement('div');
      item.className = 'cast-item';
      item.appendChild(RoleVisuals.createBall(c.role, 40));
      const nm = document.createElement('div');
      nm.className = 'cast-name';
      nm.textContent = c.count > 1 ? `${c.storyName} × ${c.count}` : c.storyName;
      const sub = document.createElement('div');
      sub.className = 'cast-role';
      sub.textContent = `策略：${r.name}（${r.nameEn}）`;
      const beh = document.createElement('p');
      beh.className = 'cast-behavior';
      beh.textContent = r.logic;
      item.appendChild(nm);
      item.appendChild(sub);
      item.appendChild(beh);
      row.appendChild(item);
    });
  }
  clearTimer() {
    if (this.timerInterval) {
      clearInterval(this.timerInterval);
      this.timerInterval = null;
    }
    this._lastTickSecond = -1;
  }

  renderTimer() {
    const wrap = document.getElementById('prediction-timer');
    if (!wrap) return;
    wrap.classList.toggle('warn', this.timeLeft <= 10);
    const text = wrap.querySelector('.timer-text');
    const prog = wrap.querySelector('.timer-progress');
    if (text) text.textContent = String(Math.max(0, this.timeLeft));
    if (prog) {
      const elapsed = StorySequence.TIMER_TOTAL - this.timeLeft;
      const off = (elapsed / StorySequence.TIMER_TOTAL) * StorySequence.TIMER_CIRC;
      prog.setAttribute('stroke-dashoffset', String(off));
    }
  }

  updateTimerUI() {
    this.renderTimer();
    if (this.timeLeft <= 5 && this.timeLeft > 0 && this.timeLeft !== this._lastTickSecond) {
      this._lastTickSecond = this.timeLeft;
      AudioManager.get().playTimerTick();
    }
  }

  onPlayerSelect(idx) {
    this.clearTimer();
    const opts = document.getElementById('story-bet-options');
    opts.querySelectorAll('.bet-card').forEach((c, i) => {
      c.classList.toggle('selected', i === idx);
      c.classList.remove('auto-picked');
    });
    this.selectedBet = idx;
    document.getElementById('btn-story-start').style.display = 'block';
  }

  autoSelectLastOption() {
    const last = this.lesson.options.length - 1;
    const opts = document.getElementById('story-bet-options');
    const cards = opts.querySelectorAll('.bet-card');
    cards.forEach(c => c.classList.remove('selected', 'auto-picked'));
    if (cards[last]) {
      cards[last].classList.add('selected', 'auto-picked');
      this.selectedBet = last;
    }
    document.getElementById('btn-story-start').style.display = 'block';
    setTimeout(() => this.startGameFromBet(), 500);
  }

  startGameFromBet() {
    if (this.selectedBet < 0) return;
    this.clearTimer();
    AudioManager.get().ensureContext();
    this.app.classroomGame.start(this.lesson, this.selectedBet);
  }

  showBet() {
    this.clearTimer();
    this.showAct('story-bet');
    this.timeLeft = StorySequence.TIMER_TOTAL;
    this.renderTimer();
    document.getElementById('story-bet-question').innerHTML =
      `经过 <strong>${this.lesson.targetRounds}</strong> 轮演变后，你认为……？<br><span style="font-size:0.95rem;color:#ccc">${this.lesson.question}</span>`;
    const opts = document.getElementById('story-bet-options');
    opts.innerHTML = '';
    document.getElementById('btn-story-start').style.display = 'none';
    this.lesson.options.forEach((opt, idx) => {
      const card = document.createElement('div');
      card.className = 'bet-card';
      card.innerHTML = `<div style="font-weight:bold;color:${this.lesson.themeColor}">${opt.id}</div>`;
      if (opt.roleRef) {
        const mini = RoleVisuals.createBall(opt.roleRef, 40);
        mini.style.margin = '0.5rem auto';
        card.insertBefore(mini, card.firstChild.nextSibling);
      }
      const lb = document.createElement('div');
      lb.className = 'bet-label';
      lb.textContent = opt.label;
      card.appendChild(lb);
      card.addEventListener('click', () => this.onPlayerSelect(idx));
      opts.appendChild(card);
    });
    this.timerInterval = setInterval(() => {
      this.timeLeft--;
      this.updateTimerUI();
      if (this.timeLeft <= 0) {
        this.clearTimer();
        this.autoSelectLastOption();
      }
    }, 1000);
  }
  bindOnce() {
    if (this._bound) return;
    this._bound = true;
    document.getElementById('btn-rules-ok').addEventListener('click', () => this.showAct('story-prelude'));
    document.getElementById('btn-prelude-next').addEventListener('click', () => this.goStoryBg());
    document.getElementById('btn-lesson2-next').addEventListener('click', () => this.goStoryBg());
    document.getElementById('btn-story-cast').addEventListener('click', () => this.showCast());
    document.getElementById('btn-story-bet').addEventListener('click', () => this.showBet());
    document.getElementById('btn-story-start').addEventListener('click', () => this.startGameFromBet());
  }
}

class RevealModal {
  constructor(refs, app) {
    this.refs = refs;
    this.app = app;
  }
  show(lesson, option, isCorrect) {
    const audio = AudioManager.get();
    audio.ensureContext();
    audio.playReveal();
    audio.startBGM();
    if (lesson.anyAnswerCorrect) audio.playPredictCorrect();
    else if (isCorrect) audio.playPredictCorrect();
    else audio.playPredictWrong();
    const ov = document.getElementById('reveal-overlay');
    document.getElementById('reveal-title').textContent = lesson.revealTitle;
    document.getElementById('reveal-title').style.color = lesson.themeColor;
    document.getElementById('reveal-story').textContent = lesson.revealStory;
    document.getElementById('reveal-theory').textContent = lesson.revealTheory;
    const fb = document.getElementById('reveal-feedback');
    if (lesson.anyAnswerCorrect) {
      fb.className = 'reveal-feedback correct';
      fb.textContent = '✓ 你的视角很有价值！';
    } else if (isCorrect) {
      fb.className = 'reveal-feedback correct';
      fb.textContent = '✓ 你的预测完全正确！';
    } else {
      fb.className = 'reveal-feedback wrong';
      fb.textContent = '✗ 大多数人第一次都会猜错——这正是博弈论反直觉的地方。';
    }
    ClassroomProgress.markComplete(lesson.id, !isCorrect && !lesson.anyAnswerCorrect);
    const nextBtn = document.getElementById('btn-reveal-next');
    if (lesson.id < 14) {
      nextBtn.style.display = 'inline-block';
      const nextId = lesson.id + 1;
      const canNext = ClassroomProgress.isUnlocked(nextId);
      nextBtn.disabled = !canNext;
      nextBtn.textContent = canNext ? `下一关（第 ${nextId} 课）` : '下一关（尚未解锁）';
    } else {
      nextBtn.style.display = 'none';
      nextBtn.disabled = false;
    }
    ov.classList.add('open');
  }
  hide() { document.getElementById('reveal-overlay').classList.remove('open'); }
  bindOnce(app) {
    if (this._bound) return;
    this._bound = true;
    document.getElementById('btn-reveal-map').addEventListener('click', () => {
      this.hide();
      app.exitClassroomToMap();
    });
    document.getElementById('btn-reveal-replay').addEventListener('click', () => {
      this.hide();
      app.replayLesson();
    });
    document.getElementById('btn-reveal-next').addEventListener('click', () => {
      const nextId = app.currentLessonId + 1;
      if (!ClassroomProgress.isUnlocked(nextId)) return;
      this.hide();
      app.startLessonStory(nextId);
    });
  }
}

class ClassroomGameController {
  constructor(sandbox, app) {
    this.sandbox = sandbox;
    this.app = app;
    this.state = new GameState();
    this.refs = sandbox.refs;
    this.circle = new CircleRenderer(this.refs, this.state);
    this.evolution = new EvolutionEngine(this.state, this.circle);
    this.lesson = null;
    this.betOption = null;
    this.autoTimer = null;
    this.paused = false;
    this._evolveHandler = null;
  }

  start(lesson, betIndex) {
    const audio = AudioManager.get();
    audio.ensureContext();
    audio.stopBGM();
    audio.startBGM();
    this.lesson = lesson;
    this.betOption = lesson.options[betIndex];
    this.stopAuto();
    const nodes = LessonConfig.buildNodes(lesson);
    this.state.reset(lesson.playerCount);
    this.state.noiseEnabled = !!lesson.forcedNoise;
    nodes.forEach((r, i) => { this.state.nodes[i] = r; });

    this.refs.screenGame.classList.add('classroom-mode');
    this.refs.unitPanel.querySelector('#panel-title').textContent = '本关角色图鉴（悬停查看规则）';
    this.renderCodex();
    this.app.ui.showScreen('screen-game');
    this.updateRoundUI();
    this.circle.evolutionRunning = false;
    this.circle.buildRing(true, lesson.radiusHint);
    for (let i = 0; i < lesson.playerCount; i++) {
      if (this.state.nodes[i]) this.circle.setSlotStrategy(i, this.state.nodes[i], true);
    }
    this.setEvolveButtonState();
    this.bindClassroomControls();
    this.bindClassroomTooltips();
  }

  renderCodex() {
    const roles = [...new Set(this.lesson.cast.map(c => c.role))];
    const list = this.refs.paletteList;
    list.innerHTML = '';
    roles.forEach(id => {
      const c = this.lesson.cast.find(x => x.role === id);
      const r = RoleVisuals.roles[id];
      const unit = document.createElement('div');
      unit.className = 'palette-unit';
      unit.dataset.strategy = id;
      unit.appendChild(RoleVisuals.createBall(id, 40));
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = c ? `${c.storyName}（${r.name}）` : r.name;
      const beh = document.createElement('div');
      beh.className = 'codex-behavior';
      beh.textContent = r.logic;
      unit.appendChild(name);
      unit.appendChild(beh);
      list.appendChild(unit);
    });
  }

  bindClassroomTooltips() {
    if (this._tooltipsBound) return;
    this._tooltipsBound = true;
    const panel = this.sandbox.panel;
    const cc = this.refs.circleContainer;
    cc.addEventListener('mouseover', (e) => {
      if (!this.refs.screenGame.classList.contains('classroom-mode')) return;
      const slot = e.target.closest('.slot.filled');
      if (!slot?.dataset.strategy) return;
      const rect = slot.getBoundingClientRect();
      panel.showTooltip(slot.dataset.strategy, rect.left + rect.width / 2, rect.top);
    });
    cc.addEventListener('mouseout', (e) => {
      if (!this.refs.screenGame.classList.contains('classroom-mode')) return;
      const slot = e.target.closest('.slot.filled');
      if (!slot) return;
      const rel = e.relatedTarget?.closest?.('.slot.filled');
      if (!rel || rel !== slot) panel.hideTooltip();
    });
    this.refs.paletteList.addEventListener('mouseover', (e) => {
      if (!this.refs.screenGame.classList.contains('classroom-mode')) return;
      const unit = e.target.closest('.palette-unit');
      if (!unit?.dataset.strategy) return;
      const rect = unit.getBoundingClientRect();
      panel.showTooltip(unit.dataset.strategy, rect.left + rect.width / 2, rect.top);
    });
    this.refs.paletteList.addEventListener('mouseout', (e) => {
      if (!this.refs.screenGame.classList.contains('classroom-mode')) return;
      if (!e.relatedTarget || !this.refs.paletteList.contains(e.relatedTarget)) panel.hideTooltip();
    });
  }

  updateRoundUI() {
    this.refs.roundDisplay.textContent = `第 ${this.state.round} 轮 / 共 ${this.lesson.targetRounds} 轮`;
  }

  setEvolveButtonState() {
    const btn = this.refs.btnEvolve;
    const mono = GameState.monocultureRole(this.state);
    const canReveal = this.state.round >= this.lesson.targetRounds || mono;
    if (canReveal) {
      btn.textContent = '查看结局';
      btn.classList.add('visible', 'reveal-ready');
    } else {
      btn.textContent = '▶ 演变';
      btn.classList.toggle('visible', this.state.isFull() && !this.evolution.running);
      btn.classList.remove('reveal-ready');
    }
  }

  bindClassroomControls() {
    if (this._evolveHandler) this.refs.btnEvolve.removeEventListener('click', this._evolveHandler);
    this._evolveHandler = () => this.onEvolveClick();
    this.refs.btnEvolve.addEventListener('click', this._evolveHandler);

    document.getElementById('btn-classroom-exit').onclick = () => {
      if (confirm('确定退出到课程地图？当前关卡进度不会保存。')) this.app.exitClassroomToMap();
    };
    document.getElementById('btn-classroom-rules').onclick = () => GameRules.openModal();
    document.getElementById('btn-classroom-skip').onclick = () => this.skipToEnd();
    const autoCb = document.getElementById('classroom-auto');
    const pauseBtn = document.getElementById('btn-classroom-pause');
    autoCb.onchange = () => {
      if (autoCb.checked) { this.paused = false; pauseBtn.style.display = 'inline-block'; this.startAuto(); }
      else { this.stopAuto(); pauseBtn.style.display = 'none'; }
    };
    pauseBtn.onclick = () => {
      this.paused = !this.paused;
      pauseBtn.textContent = this.paused ? '继续' : '暂停';
      if (!this.paused) this.startAuto();
      else this.stopAuto();
    };
  }

  async onEvolveClick() {
    if (this.state.round >= this.lesson.targetRounds || GameState.monocultureRole(this.state)) {
      this.finishLesson();
      return;
    }
    if (this.evolution.running) return;
    AudioManager.get().playEvolveClick();
    await this.runOneRound(false);
    if (GameState.monocultureRole(this.state)) {
      this.stopAuto();
      this.finishLesson();
      return;
    }
    if (this.state.round >= this.lesson.targetRounds) this.stopAuto();
    this.setEvolveButtonState();
    if (document.getElementById('classroom-auto').checked && !this.paused &&
        this.state.round < this.lesson.targetRounds && !GameState.monocultureRole(this.state)) {
      this.startAuto();
    }
  }

  async runOneRound(fast) {
    this.circle.evolutionRunning = true;
    this.refs.btnEvolve.classList.remove('visible');
    await this.evolution.runRound({
      fast,
      immortalIndices: this.lesson.immortalIndices || [],
      enableImmigration: false
    });
    this.updateRoundUI();
    this.circle.evolutionRunning = false;
    this.setEvolveButtonState();
  }

  async skipToEnd() {
    this.stopAuto();
    while (this.state.round < this.lesson.targetRounds && !GameState.monocultureRole(this.state)) {
      await this.runOneRound(true);
    }
    this.setEvolveButtonState();
    this.finishLesson();
  }

  startAuto() {
    this.stopAuto();
    this.autoTimer = setInterval(() => {
      if (this.paused || this.evolution.running) return;
      if (this.state.round >= this.lesson.targetRounds || GameState.monocultureRole(this.state)) {
        this.stopAuto();
        return;
      }
      this.onEvolveClick();
    }, 800);
  }

  stopAuto() {
    if (this.autoTimer) { clearInterval(this.autoTimer); this.autoTimer = null; }
  }

  finishLesson() {
    this.stopAuto();
    const isCorrect = this.lesson.anyAnswerCorrect || !!this.betOption.isCorrect;
    this.app.reveal.show(this.lesson, this.betOption, isCorrect);
  }

  teardown() {
    this.stopAuto();
    AudioManager.get().stopBGM();
    if (this._evolveHandler) this.refs.btnEvolve.removeEventListener('click', this._evolveHandler);
    this.refs.screenGame.classList.remove('classroom-mode');
    this.refs.unitPanel.querySelector('#panel-title').textContent = '13 种策略';
    this.refs.btnEvolve.textContent = '▶ 演变';
    this.refs.btnEvolve.classList.remove('reveal-ready');
    document.getElementById('classroom-auto').checked = false;
    document.getElementById('btn-classroom-pause').style.display = 'none';
    this.circle.clearAll();
    this.sandbox.panel.render();
  }
}

class App {
  constructor() {
    this.sandbox = new GameLoop();
    this.currentLessonId = 1;
  }
  init() {
    this.sandbox.init();
    this.refs = this.sandbox.refs;
    this.ui = this.sandbox.ui;
    this.ui.registerScreens([
      document.getElementById('screen-menu'),
      document.getElementById('screen-count'),
      document.getElementById('screen-classroom-map'),
      document.getElementById('screen-story'),
      document.getElementById('screen-game')
    ]);
    this.mainMenu = new MainMenu(this.refs, this);
    this.classroomMap = new ClassroomMap(this.refs, this);
    this.story = new StorySequence(this.refs, this);
    this.classroomGame = new ClassroomGameController(this.sandbox, this);
    this.reveal = new RevealModal(this.refs, this);
    this.mainMenu.render();
    this.story.bindOnce();
    this.reveal.bindOnce(this);
    document.getElementById('btn-map-back').addEventListener('click', () => this.goMainMenu());
    this.bindAudioToggles();
    document.getElementById('btn-sandbox-rules').addEventListener('click', () => GameRules.openModal());
    document.getElementById('btn-rules-close').addEventListener('click', () => GameRules.closeModal());
    document.getElementById('btn-dominance-ok').addEventListener('click', () => this.sandbox.hideDominanceEnd());
    document.getElementById('rules-overlay').addEventListener('click', e => {
      if (e.target.id === 'rules-overlay') GameRules.closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this.refs.screenGame.classList.contains('active') &&
          this.refs.screenGame.classList.contains('classroom-mode')) {
        if (confirm('退出到课程地图？')) this.exitClassroomToMap();
      }
    });
  }
  bindAudioToggles() {
    const audio = AudioManager.get();
    audio.updateToggleButtons();
    const toggle = () => {
      audio.ensureContext();
      audio.toggleMute();
      audio.updateToggleButtons();
    };
    document.getElementById('btn-audio-menu').addEventListener('click', toggle);
    document.getElementById('btn-audio-esc').addEventListener('click', toggle);
  }

  goMainMenu() {
    this.story.clearTimer();
    this.classroomGame.teardown();
    this.reveal.hide();
    AudioManager.get().stopBGM();
    this.ui.showScreen('screen-menu');
  }
  startSandbox() {
    this.classroomGame.teardown();
    this.ui.showScreen('screen-count');
  }
  openClassroomMap() {
    AudioManager.get().stopBGM();
    this.classroomMap.render();
    this.ui.showScreen('screen-classroom-map');
  }
  startLessonStory(id) {
    if (!ClassroomProgress.isUnlocked(id)) return;
    this.currentLessonId = id;
    const lesson = LessonConfig.getLesson(id);
    this.story.start(lesson);
  }
  replayLesson() {
    this.classroomGame.teardown();
    const lesson = LessonConfig.getLesson(this.currentLessonId);
    this.story.start(lesson);
  }
  exitClassroomToMap() {
    this.story.clearTimer();
    this.classroomGame.teardown();
    this.reveal.hide();
    this.openClassroomMap();
  }
}

/* ===== GameLoop ===== */
class GameLoop {
  constructor() {
    this.state = new GameState();
    this.refs = {};
    this.dominanceEnded = false;
  }

  cacheRefs() {
    this.refs = {
      screens: [document.getElementById('screen-menu'), document.getElementById('screen-count'), document.getElementById('screen-game')],
      btnStart: document.getElementById('btn-start'),
      countInput: document.getElementById('count-input'),
      countHint: document.getElementById('count-hint'),
      noiseToggle: document.getElementById('noise-toggle'),
      immigrationToggle: document.getElementById('immigration-toggle'),
      presetBtns: document.getElementById('preset-btns'),
      btnGenerate: document.getElementById('btn-generate'),
      btnEsc: document.getElementById('btn-esc'),
      roundDisplay: document.getElementById('round-display'),
      arena: document.getElementById('arena'),
      arenaScaler: document.getElementById('arena-scaler'),
      circleContainer: document.getElementById('circle-container'),
      linesSvg: document.getElementById('lines-svg'),
      btnEvolve: document.getElementById('btn-evolve'),
      unitPanel: document.getElementById('unit-panel'),
      panelTab: document.getElementById('panel-tab'),
      paletteList: document.getElementById('palette-list'),
      tooltip: document.getElementById('tooltip'),
      escOverlay: document.getElementById('esc-overlay'),
      saveSlotsPanel: document.getElementById('save-slots-panel'),
      btnClear: document.getElementById('btn-clear'),
      btnRandom: document.getElementById('btn-random'),
      btnGameRules: document.getElementById('btn-game-rules'),
      screenGame: document.getElementById('screen-game')
    };
  }

  init() {
    this.cacheRefs();
    this.ui = new UIManager(this.refs);
    this.save = new SaveManager(this.refs);
    this.circle = new CircleRenderer(this.refs, this.state);
    this.panel = new UnitPanel(this.refs);
    this.evolution = new EvolutionEngine(this.state, this.circle);
    this.drag = new DragDropManager(this.refs, this.state, this.circle, () => this.circle.updateEvolveButton());
    this.panel.render();
    this.ui.renderPresetButtons(id => {
      const n = this.ui.validateCount(this.refs.countInput.value);
      if (!n) return;
      this.state.pendingPreset = this.ui.buildPresetLayout(id, n);
      this.refs.countHint.textContent = `已选预设，点击「生成圆环」开始`;
    });
    this.bindEvents();
  }

  bindEvents() {
    const r = this.refs;
    document.querySelectorAll('.quick-count').forEach(btn => {
      btn.addEventListener('click', () => { r.countInput.value = btn.dataset.n; r.countHint.textContent = ''; this.state.pendingPreset = null; });
    });
    r.btnGenerate.addEventListener('click', () => {
      AudioManager.get().ensureContext();
      const n = this.ui.validateCount(r.countInput.value);
      if (!n) return;
      this.startGame(n);
    });
    r.btnEsc.addEventListener('click', () => { if (r.screenGame.classList.contains('active')) this.ui.toggleEsc(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && r.screenGame.classList.contains('active') &&
          !r.screenGame.classList.contains('classroom-mode')) this.ui.toggleEsc();
    });
    r.escOverlay.querySelectorAll('.esc-action').forEach(btn => {
      btn.addEventListener('click', () => this.handleEsc(btn.dataset.action));
    });
    r.btnEvolve.addEventListener('click', () => this.runEvolve());
    r.panelTab.addEventListener('click', () => this.panel.expand());
    r.btnClear.addEventListener('click', () => this.clearRing());
    r.btnRandom.addEventListener('click', () => this.randomFill());
    r.btnGameRules.addEventListener('click', () => GameRules.openModal());
    if (r.immigrationToggle) {
      try {
        const saved = localStorage.getItem('trustEvolution_immigration');
        if (saved === '0') r.immigrationToggle.checked = false;
      } catch (_) {}
      r.immigrationToggle.addEventListener('change', () => {
        this.state.immigrationEnabled = r.immigrationToggle.checked;
        try { localStorage.setItem('trustEvolution_immigration', this.state.immigrationEnabled ? '1' : '0'); } catch (_) {}
      });
    }
    r.paletteList.addEventListener('mouseenter', e => {
      const unit = e.target.closest('.palette-unit');
      if (!unit) return;
      const rect = unit.getBoundingClientRect();
      this.panel.showTooltip(unit.dataset.strategy, rect.left + rect.width / 2, rect.top);
    }, true);
    r.paletteList.addEventListener('mouseleave', e => {
      if (!e.relatedTarget || !r.paletteList.contains(e.relatedTarget)) this.panel.hideTooltip();
    }, true);
    this.drag.bind();
    window.addEventListener('resize', () => {
      if (this.state.playerCount && r.screenGame.classList.contains('active')) this.circle.buildRing(false);
    });
  }

  startGame(n) {
    this.hideDominanceEnd();
    const preset = this.state.pendingPreset;
    this.state.reset(n);
    this.state.noiseEnabled = this.refs.noiseToggle.checked;
    if (this.refs.immigrationToggle) {
      this.state.immigrationEnabled = this.refs.immigrationToggle.checked;
      try { localStorage.setItem('trustEvolution_immigration', this.state.immigrationEnabled ? '1' : '0'); } catch (_) {}
    }
    if (preset && preset.length === n) {
      for (let i = 0; i < n; i++) this.state.nodes[i] = preset[i];
    }
    this.state.pendingPreset = null;
    this.ui.showScreen('screen-game');
    this.ui.setRoundText(0);
    this.panel.expand();
    this.circle.evolutionRunning = false;
    this.circle.buildRing(true);
    if (preset) {
      for (let i = 0; i < n; i++) if (this.state.nodes[i]) this.circle.setSlotStrategy(i, this.state.nodes[i], true);
    }
  }

  hideDominanceEnd() {
    document.getElementById('dominance-overlay').classList.remove('open');
    this.dominanceEnded = false;
  }

  showDominanceEnd(roleId) {
    const name = RoleVisuals.roles[roleId]?.name || roleId;
    document.getElementById('dominance-text').textContent = `${name}统治了这场博弈`;
    document.getElementById('dominance-overlay').classList.add('open');
    this.dominanceEnded = true;
    this.circle.evolutionRunning = false;
    this.refs.btnEvolve.classList.remove('visible');
    this.ui.setRoundText(`第 ${this.state.round} 轮 · 单一策略统治`);
  }

  async runEvolve() {
    if (!this.state.isFull() || this.evolution.running || this.dominanceEnded) return;
    AudioManager.get().playEvolveClick();
    this.circle.evolutionRunning = true;
    this.refs.btnEvolve.classList.remove('visible');
    this.panel.collapse();
    await this.evolution.runRound({
      enableImmigration: this.state.immigrationEnabled !== false
    });
    this.ui.setRoundText(this.state.round);
    this.circle.evolutionRunning = false;
    const mono = GameState.monocultureRole(this.state);
    if (mono) {
      this.showDominanceEnd(mono);
      return;
    }
    this.circle.updateEvolveButton();
  }

  clearRing() {
    this.hideDominanceEnd();
    for (let i = 0; i < this.state.playerCount; i++) {
      this.state.nodes[i] = null;
      this.circle.clearSlot(i);
    }
    this.state.cumulativeScores = Array(this.state.playerCount).fill(0);
    this.state.scoreHistory = Array.from({ length: this.state.playerCount }, () => []);
    this.circle.updateEvolveButton();
  }

  randomFill() {
    const ids = RoleVisuals.getRoleIds();
    for (let i = 0; i < this.state.playerCount; i++) {
      const id = ids[Math.floor(Math.random() * ids.length)];
      this.state.nodes[i] = id;
      this.state.scoreHistory[i] = [];
      this.circle.setSlotStrategy(i, id);
    }
    this.circle.updateEvolveButton();
  }

  handleEsc(action) {
    switch (action) {
      case 'resume': this.ui.closeEsc(); break;
      case 'save':
        this.save.renderSlotButtons('save', idx => {
          this.save.save(idx, this.state);
          alert(`已保存到档位 ${idx + 1}`);
        });
        break;
      case 'load':
        this.save.renderSlotButtons('load', (idx, data) => {
          if (!data) return;
          this.state.deserialize(data);
          this.refs.noiseToggle.checked = this.state.noiseEnabled;
          if (this.refs.immigrationToggle) this.refs.immigrationToggle.checked = this.state.immigrationEnabled !== false;
          this.ui.closeEsc();
          this.ui.showScreen('screen-game');
          this.ui.setRoundText(this.state.round);
          this.panel.expand();
          this.circle.buildRing(false);
          for (let i = 0; i < this.state.playerCount; i++) {
            if (this.state.nodes[i]) this.circle.setSlotStrategy(i, this.state.nodes[i], false);
            if (this.state.cumulativeScores[i]) {
              const rs = this.state.roundScores.length ? this.state.roundScores[this.state.roundScores.length - 1][i] : 0;
              this.circle.updateScoreLabel(i, this.state.cumulativeScores[i], rs);
            }
          }
          this.circle.updateEvolveButton();
        });
        break;
      case 'quit':
        if (confirm('确定退出到主菜单？未保存进度将丢失')) {
          this.ui.closeEsc();
          this.ui.showScreen('screen-menu');
          this.circle.clearAll();
          this.state.reset(0);
        }
        break;
    }
  }
}

document.addEventListener('DOMContentLoaded', () => new App().init());
</script>
